<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Góc nhỏ </title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1PQxlrtdBxvsrBZhVvr1XlmrBuvom8bP37CFyzymOwg&s=10">
<style>
:root{--bg:#f7f5ff;--bg2:#ffe6ef;--cd:#fff;--ink:#2b2745;--mu:#7b7796;--ln:#e8e3fb;--pr:#7c6cf0;--pt:#5a49d6;--p2:#f58fb0;--so:#f1eeff;--bad:#e5484d;--sh:0 6px 22px #7c6cf01c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14121f;--bg2:#2a1830;--cd:#1f1c30;--ink:#ece9fb;--mu:#a5a1c2;--ln:#35314f;--pt:#b9afff;--so:#2a2644;--sh:0 6px 22px #0008}}
:root[data-theme=dark]{--bg:#14121f;--bg2:#2a1830;--cd:#1f1c30;--ink:#ece9fb;--mu:#a5a1c2;--ln:#35314f;--pt:#b9afff;--so:#2a2644;--sh:0 6px 22px #0008}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:400 16px/1.65 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(circle at 0 0,var(--bg2),transparent 42%),radial-gradient(circle at 100% 12%,var(--so),transparent 40%);background-attachment:fixed}
header{max-width:980px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:1.35rem;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--pr),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto}
nav{display:flex;gap:6px}
.nb,.ic{border:1px solid var(--ln);background:var(--cd);color:var(--mu);border-radius:99px;padding:6px 14px;font:600 .9rem 'Be Vietnam Pro',sans-serif;cursor:pointer}.nb.on{background:var(--so);color:var(--pt);border-color:var(--pr)}
main{max-width:980px;margin:0 auto;padding:10px 16px 70px}
h2,h3{margin:.3em 0;font-weight:700}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.fo{cursor:pointer;text-align:center;transition:.2s;margin:0;border:0}.fo:hover{transform:translateY(-4px)}.fo .mu{color:inherit;opacity:.7}.em{font-size:2.4rem;line-height:1.2}
.fh{flex:1;display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:22px;box-shadow:var(--sh)}.fh h2{margin:0}
.btn{background:linear-gradient(135deg,var(--pr),#a37cf5);color:#fff;border:0;border-radius:14px;padding:10px 18px;font:600 .95rem/1.2 'Be Vietnam Pro',sans-serif;cursor:pointer;display:inline-block;box-shadow:0 4px 12px #7c6cf033}
.btn:hover{filter:brightness(1.08)}.btn.g{background:var(--so);color:var(--pt);box-shadow:none}.btn.sm{padding:5px 11px;font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}.bar h2{flex:1;margin:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:8px 11px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:1px}
textarea{width:100%;min-height:80px;margin:6px 0}
.ch{display:inline-block;border:1px solid var(--ln);background:var(--so);border-radius:99px;padding:2px 11px;font-size:.82rem;cursor:pointer;margin:2px;color:var(--ink)}
.ch.on{background:var(--pr);color:#fff;border-color:var(--pr)}.mu{color:var(--mu)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);cursor:pointer;display:inline-block}
.pb{height:10px;background:var(--so);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--p2));transition:.4s}
.tabs{display:flex;gap:8px;margin:14px 0}.tb{flex:1;padding:10px;border:1px solid var(--ln);background:var(--cd);color:var(--mu);border-radius:14px;font:600 .95rem 'Be Vietnam Pro',sans-serif;cursor:pointer}.tb.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.fl{perspective:1200px;height:min(360px,55vh);cursor:pointer;margin:14px 0}
.fi{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.fl.on .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto;font-size:1.2rem;box-shadow:var(--sh)}
.ff{background:var(--cd);border:1px solid var(--ln)}
.fb{transform:rotateY(180deg);background:linear-gradient(135deg,#7c6cf0,#f58fb0);color:#fff;font-weight:600}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--ink);font:inherit;cursor:pointer}
.op:hover{border-color:var(--pr)}.op.ok{background:#dcf7ea;border-color:#34b37a;color:#0c4a2c}.op.no{background:#ffe3e8;border-color:var(--bad);color:#5c0b1a}
mark{background:#fff0a8;color:#2b2745;border-radius:6px;padding:0 5px}
.bk{display:inline-block;min-width:80px;border-bottom:3px solid var(--p2)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}@media(max-width:620px){.cmp{grid-template-columns:1fr}}.cmp>div{background:var(--so);border-radius:16px;padding:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal b{text-align:center;color:var(--mu);font-size:.8rem}
.dy{aspect-ratio:1;border-radius:14px;border:1px solid var(--ln);background:var(--cd);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;color:var(--ink);padding:0}
.dy i{font-size:.55rem;line-height:1;color:var(--p2);font-style:normal;height:.6rem}.dy.td{border-color:var(--pr);font-weight:700}.dy.sl{background:var(--pr);color:#fff}.dy.sl i{color:#fff}
.ev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--so);margin:6px 0}.ev.fin>div{opacity:.5;text-decoration:line-through}.etm{font-weight:700;color:var(--pt);min-width:3.4em}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9;box-shadow:var(--sh)}
.qc{margin:2px 0}.opl{display:flex;gap:8px;padding:5px 10px;margin:3px 0;border-radius:10px;background:var(--so)}.opl span{font-weight:700;color:var(--pt);min-width:1.1em}
.opl.cor{background:#dcf7ea;color:#0c4a2c;font-weight:600}.opl.cor span{color:#1f8a5b}
.chp{margin:22px 0 6px;padding:8px 14px;border-radius:14px;background:linear-gradient(120deg,var(--pr),var(--p2));color:#fff;font-size:1.02rem}
.pv{display:flex;gap:10px;align-items:flex-start;margin:6px 0;padding:10px 14px;cursor:pointer}.pv input{margin-top:6px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600;color:var(--pt)}
</style></head><body>
<header><b data-a="home">☁️ Nig Cloud</b><nav><button class="nb on" data-a="home">📚 Thư mục</button><button class="nb" data-a="plan">📅 Lịch học</button></nav><button class="ic" data-a="th">🌓</button></header>
<main id="app"></main><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),now=()=>Date.now(),INT=[0,1,3,7,16,35],due=c=>c.due<=now();
const TG={kho:'😰 Khó nhớ',de:'😊 Dễ nhớ',qt:'⭐ Quan trọng',nham:'🔖 Dễ nhầm'};
let D=null;try{D=JSON.parse(localStorage.getItem('laxanh'))}catch(e){}
if(!D||!D.f)D={f:[{id:'tr',n:'Triết học',e:'📚'}],c:[
{t:'qa',q:'Vấn đề cơ bản của triết học là gì?',a:'Mối quan hệ giữa tư duy và tồn tại (ý thức và vật chất).'},
{t:'mcq',q:'Triết học ra đời ở thời kỳ nào?',o:['Thời nguyên thủy','Thời cổ đại (thế kỷ VIII–VI TCN)','Thời cận đại'],k:[1]},
{t:'cloze',q:'Chủ nghĩa {{duy vật}} cho rằng vật chất có trước, ý thức có sau.'}].map(c=>({id:uid(),f:'tr',tg:[],bx:0,due:0,...c}))};
D.s=D.s||[];
const sv=()=>{try{localStorage.setItem('laxanh',JSON.stringify(D))}catch(e){}};
const T=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(T.h);T.h=setTimeout(()=>t.hidden=true,2600)};
let V={p:'home',fid:null,tf:'',add:0};
const cur=()=>D.c.find(c=>c.id==V.ses.q[V.ses.i]);
const bl=s=>esc(s).replace(/\{\{(.+?)\}\}/g,'<span class=bk>&nbsp;</span>'),hl=s=>esc(s).replace(/\{\{(.+?)\}\}/g,'<mark>$1</mark>');
const ans=c=>c.t=='qa'||c.t=='tl'?c.a:c.t=='mcq'?c.k.map(i=>c.o[i]).join(' · '):[...c.q.matchAll(/\{\{(.+?)\}\}/g)].map(m=>m[1]).join(' · ');
const qt=c=>c.t=='cloze'?bl(c.q):(c.n?'Câu '+c.n+'. ':'')+esc(c.q);
const front=c=>c.t=='mcq'?`<b>${c.n?'Câu '+c.n+'. ':''}${esc(c.q)}</b><ol type=A style="text-align:left;font-size:1rem">${c.o.map(o=>`<li>${esc(o)}</li>`).join('')}</ol>`:qt(c);
const back=c=>c.t=='cloze'?hl(c.q):c.t=='mcq'?c.o.map((o,i)=>c.k.includes(i)?`<mark>✓ ${'ABCDEFGH'[i]}. ${esc(o)}</mark>`:'').join('<br>'):esc(c.a).replace(/\n/g,'<br>');
const tags=c=>Object.entries(TG).map(([k,v])=>`<span class="ch ${c.tg.includes(k)?'on':''}" data-a=tg data-v="${c.id}|${k}">${v}</span>`).join('');
const pvw=c=>c.t=='cloze'?hl(c.q):c.t=='mcq'?esc(c.q)+'<br>'+c.o.map((o,i)=>c.k.includes(i)?`<mark>${esc(o)}</mark>`:esc(o)).join(' · '):esc(c.q)+' → <mark>'+esc(c.a)+'</mark>';
const R=()=>{$('#app').innerHTML={home,folder,study,imp,plan}[V.p]();document.querySelectorAll('nav [data-a]').forEach(b=>b.classList.toggle('on',b.dataset.a==(V.p=='plan'?'plan':'home')))};

const EM=['📚','🧠','⚖️','🧬','🧪','📐','🌍','💻','🗣️','🎨','🏛️','📝','🔬','💡','🎯','🌸'],PC=['#e9e3ff','#ffe1ea','#ffecd2','#dff3ff','#dcf7ea','#fff3bf','#f3e1ff','#ffdcd2'];
const tc=h=>{const n=parseInt(h.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);return l>150?'#2b2745':'#fff'};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ds(new Date()),wd=k=>new Date(k+'T00:00:00').getDay();
const occ=(e,k)=>k==e.d||k>e.d&&(e.rp=='daily'||e.rp=='wk'&&wd(k)>0&&wd(k)<6||e.rp=='weekly'&&wd(k)==wd(e.d));
const evs=k=>D.s.filter(e=>occ(e,k)).sort((a,b)=>a.tm<b.tm?-1:1);
const MN={flip:'🃏 Lật thẻ',quiz:'✅ Trắc nghiệm',type:'✍️ Tự luận'};
const SS=`<select id=ss><option value=due>Đến hạn ôn</option><option value=all>Tất cả thẻ</option><option value=new>Chưa thuộc</option>${Object.entries(TG).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select>`;
const hlw=(t,ws)=>{let h=esc(t).replace(/\n/g,'<br>');if(ws.length)h=h.replace(new RegExp('('+ws.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>');return h};
const ff=(n,e,col)=>`<div class=row><input id=fe value="${esc(e)}" maxlength=8 style="width:76px;font-size:1.5rem;text-align:center"><input id=fn value="${esc(n)}" placeholder="Tên thư mục, VD: Triết học" style="flex:1;min-width:160px"><input type=color id=fcl value="${col}" style="width:56px;height:44px;padding:2px"></div><div class=row><span class=mu>Icon:</span>${EM.map(x=>`<span class=ch data-a=pe data-v="${x}">${x}</span>`).join('')}</div><div class=row><span class=mu>Màu nền:</span>${PC.map(x=>`<span class=sw data-a=pc data-v="${x}" style="background:${x}"></span>`).join('')}</div>`;
const evRow=(e,k)=>{const f=D.f.find(x=>x.id==e.f),dn=e.dn&&e.dn[k];return `<div class="ev ${dn?'fin':''}"><span class=etm>${esc(e.tm)}</span><div style="flex:1"><b>${f?esc(f.e)+' '+esc(f.n):'(thư mục đã xóa)'}</b> <span class=mu>· ${MN[e.m]}${e.rp!='no'?' · 🔁':''}</span>${e.nt?`<div class=mu>${esc(e.nt)}</div>`:''}</div><button class="btn g sm" data-a=dn data-v="${e.id}|${k}">${dn?'↩ Bỏ tick':'✔ Xong'}</button><button class="btn sm" data-a=ls data-v="${e.id}|${k}">▶ Học</button><button class="btn g sm" data-a=de data-v="${e.id}">🗑</button></div>`};

function home(){const dn=D.c.filter(due).length,td=today(),te=evs(td);
return `<div class=bar><h2>📚 Thư mục của bạn</h2><button class=btn data-a=all>🔥 Ôn mọi thẻ đến hạn (${dn})</button></div>
${te.length?`<div class=box><h3>📅 Hôm nay · ${te.length} buổi học</h3>${te.map(e=>evRow(e,td)).join('')}</div>`:''}
<div class=grid>${D.f.map(f=>{const cs=D.c.filter(c=>c.f==f.id),col=f.col||'#e9e3ff';return `<div class="box fo" data-a=open data-v="${f.id}" style="background:${col};color:${tc(col)}"><div class=em>${esc(f.e)}</div><b>${esc(f.n)}</b><div class=mu>${cs.length} thẻ · ${cs.filter(due).length} đến hạn</div></div>`}).join('')}</div>
<div class=box><h3>＋ Thư mục mới</h3>${ff('','📚','#e9e3ff')}<button class=btn data-a=nf>Tạo thư mục</button></div>
<div class=box><h3>💾 Sao lưu</h3><p class=mu>Dữ liệu lưu trong trình duyệt này — hãy xuất file sao lưu thường xuyên.</p><div class=row><button class="btn g" data-a=ex>⬇ Xuất file</button><label class="btn g">⬆ Khôi phục<input type=file accept=.json data-c=rs hidden></label></div></div>`}

function folder(){const f=D.f.find(x=>x.id==V.fid),col=f.col||'#e9e3ff',all=D.c.filter(c=>c.f==f.id),nt=all.filter(c=>c.t=='tl').length,tl=V.tab=='tl',base=all.filter(c=>(c.t=='tl')==tl),chs=[...new Set(base.map(c=>c.ch).filter(Boolean))],cs=base.filter(c=>!V.tf||c.tg.includes(V.tf));let last=null;
return `<div class=bar><button class="btn g" data-a=home>←</button><div class=fh style="background:${col};color:${tc(col)}"><span class=em>${esc(f.e)}</span><div style="flex:1"><h2>${esc(f.n)}</h2><div style="opacity:.75">${all.length-nt} thẻ · ${nt} tự luận</div></div><button class="btn g sm" data-a=ef>✏️ Sửa</button></div></div>
${V.ef?`<div class=box>${ff(f.n,f.e,col)}<div class=row><button class=btn data-a=sf>💾 Lưu</button><button class="btn g" data-a=df>🗑 Xóa thư mục</button></div></div>`:''}
<div class=tabs><button class="tb ${tl?'':'on'}" data-a=tab data-v=card>🃏 Thẻ &amp; trắc nghiệm</button><button class="tb ${tl?'on':''}" data-a=tab data-v=tl>✍️ Tự luận (${nt})</button></div>
<div class=box><h3>${tl?'✍️ Viết rồi so với đáp án chuẩn':'🎯 Ôn tập'}</h3>${tl?'<p class=mu>Đọc câu hỏi, tự viết câu trả lời, rồi AI so với đáp án chuẩn và chỉ ra ý còn thiếu.</p>':''}<div class=row>${tl?'':'<select id=sm><option value=flip>🃏 Lật thẻ (lặp lại ngắt quãng)</option><option value=quiz>✅ Trắc nghiệm</option></select>'}${chs.length?`<select id=sc><option value="">Tất cả chương</option>${chs.map(h=>`<option value="${esc(h)}">${esc(h)}</option>`).join('')}</select>`:''}${SS}<label><input type=checkbox id=sh checked> Xáo trộn</label><button class=btn data-a=start>▶ Bắt đầu</button></div></div>
<div class=row><button class=btn data-a=ac>＋ ${tl?'Thêm câu tự luận':'Thêm thẻ'}</button><button class="btn g" data-a=im>📄 Nhập từ Word / PDF</button></div>
${V.add?`<div class=box><textarea id=nq placeholder="${tl?'Câu hỏi tự luận':'Câu hỏi / mặt trước (dùng {{từ}} để tạo ô điền khuyết)'}"></textarea><textarea id=na placeholder="${tl?'Đáp án chuẩn (viết đủ các ý chính)':'Đáp án / mặt sau (bỏ trống nếu là điền khuyết)'}"></textarea><button class=btn data-a=sc>Lưu</button></div>`:''}
<div class=row><b>Lọc:</b><span class="ch ${V.tf?'':'on'}" data-a=tf data-v="">Tất cả</span>${Object.entries(TG).map(([k,v])=>`<span class="ch ${V.tf==k?'on':''}" data-a=tf data-v=${k}>${v}</span>`).join('')}</div>
${cs.map(c=>{const h=c.ch&&c.ch!=last?(last=c.ch,`<h3 class=chp>📖 ${esc(c.ch)}</h3>`):'';return h+`<div class=box style="margin:8px 0;padding:14px">${rd(c)}<div class=row style="margin:6px 0 0">${tags(c)}<span class=mu>📦 ${c.bx}/5</span><button class="btn g sm" data-a=dc data-v="${c.id}">Xóa</button></div></div>`}).join('')||'<p class=mu>Chưa có gì ở đây 🌸</p>'}`}

function plan(){const n=new Date(),{y,m}=V.cm||(V.cm={y:n.getFullYear(),m:n.getMonth()}),sel=V.sel||(V.sel=today()),fd=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),cells=[];
for(let i=0;i<fd;i++)cells.push('<span></span>');
for(let d=1;d<=nd;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),c=evs(k).length;cells.push(`<button class="dy ${k==today()?'td':''} ${k==sel?'sl':''}" data-a=sd data-v=${k}>${d}<i>${'●'.repeat(Math.min(c,3))}</i></button>`)}
return `<div class=bar><h2>📅 Lịch học cá nhân</h2></div>
<div class=box><div class=bar><button class="btn g sm" data-a=pmo>‹</button><h3 style="flex:1;text-align:center">Tháng ${m+1} / ${y}</h3><button class="btn g sm" data-a=nmo>›</button></div><div class=cal>${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<b>${x}</b>`).join('')}${cells.join('')}</div></div>
<div class=box><h3>${sel.split('-').reverse().join('/')}${sel==today()?' · Hôm nay':''}</h3>${evs(sel).map(e=>evRow(e,sel)).join('')||'<p class=mu>Chưa có buổi học nào — thêm ở dưới 👇</p>'}</div>

${Object.entries(W.o).sort((a,b)=>b[1].p-a[1].p).map(([g,r])=>`<div class=rr><span title="${esc(g)}">${esc(g)}</span><div class=pb><i style="width:${r.p?Math.min(100,100*r.a/r.p):0}%"></i></div><b>${dur(r.a)}/${dur(r.p)}</b></div>`).join('')||'<p class=mu>Tuần này chưa có lịch.</p>'}

/* 4 · gắn vào trang lịch + trang chủ */
const pl6=plan;plan=function(){let h=pl6();const sel=V.sel,es=evs(sel),c=cfl(es),o=od(),ov=new Set(o.filter(x=>x.k==sel).map(x=>x.e.id)),tot=es.reduce((a,e)=>a+len(e),0),r=rn(es),W=[];
c.p.forEach(([a,b])=>W.push(`<div class="exl w2">⚠ Trùng giờ: <b>${esc(lb(a))}</b> (${esc(a.tm)}–${hm(be(a))}) ↔ <b>${esc(lb(b))}</b> (${esc(b.tm)}–${hm(be(b))})</div>`));
if(tot>MX())W.push(`<div class="exl w2">⚠ Lịch quá dày: ${dur(tot)} trong ngày (giới hạn ${dur(MX())}). Nên dời bớt sang ngày khác.</div>`);
if(r>180)W.push(`<div class="exl o2">⚠ Học liên tục ${dur(r)} gần như không nghỉ — nên chen nghỉ 10–15 phút.</div>`);
const al=W.length?`<div class=box style="border-left:5px solid var(--bad)"><h3>⚠ Cảnh báo · ${fd(sel)}</h3>${W.join('')}</div>`:'',mk='<div class=box><div class=bar><h3 style="flex:1;margin:0">🗓';
h=h.replace(/<div class="ev ([^"]*)">([\s\S]*?)data-a=dn data-v="([^|"]+)\|/g,(m,cl,x,id)=>{const b=(c.ids.has(id)?tg('⚠ trùng giờ','w2'):'')+(ov.has(id)?tg('⏰ quá hạn','o2'):'');return `<div class="ev ${cl}${c.ids.has(id)?' cf':ov.has(id)?' ovd':''}">`+x.replace('<b>',b+'<b>')+'data-a=dn data-v="'+id+'|'});
const I=ins();if(I&&I.r<.95)h=h.replace('<div class=row><span class=mu>Độ dài nhanh:</span>',m=>`<div class=mu style="font-size:.85rem;margin:6px 0">💡 Bạn thường chỉ học ~${Math.round(100*I.r)}% thời gian dự kiến — muốn học thật 60p, hãy xếp ~${dur(Math.round(60/I.r/5)*5)}.</div>`+m);
return h.replace(mk,()=>ovb(o)+al+mk)+stats(sel,es)};
const hh6=home;home=function(){const o=od(),h=hh6();return o.length?h.replace('<div class=grid>',()=>ovb(o)+'<div class=grid>'):h};

/* 5 · ghi thời gian thực tế: bấm giờ, nhập tay, hoặc tự cộng khi học từ nút ▶ Học */
const stop=()=>{const t=D.tm;if(!t)return;D.tm=null;const e=D.s.find(x=>x.id==t.id);if(e){(e.ac=e.ac||{})[t.k]=ac(e,t.k)+Math.max(1,Math.round((now()-t.t0)/6e4));(e.dn=e.dn||{})[t.k]=1}sv()},
fl=()=>{const s=V.ses;if(s&&s.ev&&s.t0&&!s.acd){s.acd=1;const e=D.s.find(x=>x.id==s.ev.id);if(e){(e.ac=e.ac||{})[s.ev.day]=ac(e,s.ev.day)+Math.max(1,Math.round((now()-s.t0)/6e4));sv()}}};
const go6=go;go=function(...a){fl();go6(...a)};

C.ac=t=>{const[id,k]=t.dataset.k.split('|'),e=D.s.find(x=>x.id==id);if(!e)return;(e.ac=e.ac||{})[k]=Math.max(0,Math.min(1440,Math.round(+t.value||0)));sv();R()};
C.mx=t=>{D.mx=Math.round(Math.max(1,Math.min(16,+t.value||6))*60);sv();R()};
setInterval(()=>{const t=D.tm,x=$('#lvt');if(t&&x){const s=Math.floor((now()-t.t0)/1e3);x.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}},1000);

<script>
(()=>{
const MM=()=>D.mm=D.mm||{},nid=()=>uid(),mmR=()=>{const w=$('.mmw'),l=w?w.scrollLeft:0,t=w?w.scrollTop:0;R();const x=$('.mmw');if(x){x.scrollLeft=l;x.scrollTop=t}},
cp=s=>{try{navigator.clipboard.writeText(s).then(()=>T('Đã sao chép 📋'),()=>T('Trình duyệt chặn sao chép'))}catch(e){T('Trình duyệt chặn sao chép')}},
tr=()=>{const k=V.fid+'|'+(V.mc||''),m=MM();if(!m[k]){const f=D.f.find(x=>x.id==V.fid);m[k]={id:nid(),t:V.mc||(f?f.n:'Chủ đề'),c:[]}}return m[k]},
fnd=(n,id,p)=>{if(n.id==id)return{n,p};for(const c of n.c){const r=fnd(c,id,n);if(r)return r}return null},
cur=()=>V.mn?fnd(tr(),V.mn):null,
cc=()=>[...new Set(D.c.filter(c=>c.f==V.fid&&c.ch).map(c=>c.ch))],
chs=()=>[...new Set(cc().concat(Object.keys(MM()).filter(k=>k.startsWith(V.fid+'|')&&k.length>V.fid.length+1).map(k=>k.slice(V.fid.length+1))))];
V.rv=new Set();

/* ===== MINDMAP theo chương ===== */
const CL=['#6366f1','#10b981','#f97316','#ec4899','#0ea5e9','#a855f7','#eab308','#ef4444'],wd=t=>Math.min(250,24+[...t].length*7.4);
const lay=root=>{const nodes=[],mw=[];let y=0;
const walk=(n,d,col)=>{const w=wd(n.t||'…'),o={n,d,w,col,y:0,ch:[]};mw[d]=Math.max(mw[d]||0,w);nodes.push(o);
if(n.x&&d>0||!n.c.length)o.y=(y+=38)-38;else{n.c.forEach((c,i)=>o.ch.push(walk(c,d+1,d==0?(c.k||CL[i%CL.length]):col)));o.y=(o.ch[0].y+o.ch[o.ch.length-1].y)/2}return o};
walk(root,0,CL[0]);const xs=[0];for(let d=1;d<mw.length;d++)xs[d]=xs[d-1]+mw[d-1]+56;nodes.forEach(o=>o.x=xs[o.d]);
return{nodes,W:xs[mw.length-1]+mw[mw.length-1]+34,H:Math.max(y,38)+8}};
const svg=L=>{let p='',g='';
L.nodes.forEach(o=>o.ch.forEach(c=>{const x1=o.x+o.w,y1=o.y+19,x2=c.x,y2=c.y+19,m=(x1+x2)/2;p+=`<path d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill="none" stroke="${c.col}" stroke-width="2" opacity=".6"/>`}));
L.nodes.forEach(o=>{const n=o.n,lf=!n.c.length,rt=o.d==0,hid=V.rc&&lf&&!rt&&!V.rv.has(n.id),t=hid?'• • •':(n.t||'…'),mx=Math.floor((o.w-20)/7.4),tx=[...t].length>mx?[...t].slice(0,mx-1).join('')+'…':t,b=rt||o.d==1;
g+=`<g data-a="mn" data-v="${n.id}" style="cursor:pointer"><rect x="${o.x}" y="${o.y+2}" width="${o.w}" height="34" rx="${rt?17:10}" style="fill:${rt?'url(#mg)':o.d==1?o.col:'color-mix(in srgb,'+o.col+' 14%,var(--cd))'};stroke:${o.col};stroke-width:${V.mn==n.id?3.5:1.5}"/><text x="${o.x+o.w/2}" y="${o.y+24}" text-anchor="middle" style="font:${b?600:400} 13px 'Be Vietnam Pro',sans-serif;fill:${b?'#fff':'var(--ink)'}">${esc(tx)}</text>${n.x&&n.c.length?`<text x="${o.x+o.w+4}" y="${o.y+24}" style="font-size:11px;fill:var(--mu)">＋${n.c.length}</text>`:''}</g>`});
return `<svg width="${L.W}" height="${L.H}" viewBox="0 0 ${L.W} ${L.H}"><defs><linearGradient id="mg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g3)"/></linearGradient></defs>${p}${g}</svg>`};
const o2t=(n,d=0)=>n.c.map(c=>'  '.repeat(d)+c.t+'\n'+o2t(c,d+1)).join(''),
t2o=s=>{const root=[],st=[{d:-1,c:root}];s.split('\n').forEach(l=>{if(!l.trim())return;const m=l.match(/^[\t ]*/)[0],d=m.split('\t').length-1+Math.floor(m.replace(/\t/g,'').length/2),n={id:nid(),t:l.trim().replace(/^[-*•]\s+/,''),c:[]};while(st.length>1&&st[st.length-1].d>=d)st.pop();st[st.length-1].c.push(n);st.push({d,c:n.c})});return root};
const nb=()=>{const t=tr(),f=cur();if(!f)return '<p class=mu>Chạm vào một nút để sửa chữ, thêm nhánh, tô màu…</p>';const n=f.n,rt=!f.p;
return `<div class=exl><div class=row style="margin:0"><input id=mnt data-c=mnt value="${esc(n.t)}" style="flex:1;min-width:150px"><button class="btn sm" data-a=mac>＋ Nhánh con</button>${rt?'':'<button class="btn g sm" data-a=mas>＋ Cùng cấp</button>'}${n.c.length?`<button class="btn g sm" data-a=mcl>${n.x?'▸ Mở':'▾ Thu'}</button><button class="btn g sm" data-a=mcd>🃏 Tạo thẻ</button>`:''}${rt?'':'<button class="btn g sm" data-a=mdl>🗑</button>'}</div>${f.p===t?`<div class=row style="margin:6px 0 0"><span class=mu>Màu nhánh:</span>${CL.map(c=>`<span class=sw data-a=mcc data-v="${c}" style="background:${c};width:22px;height:22px"></span>`).join('')}</div>`:''}</div>`};
const mmv=()=>{const t=tr(),L=lay(t);
return `<div class=box><div class=row style="margin:0"><select data-c=mcs><option value="">🧠 Cả thư mục</option>${chs().map(c=>`<option value="${esc(c)}" ${V.mc==c?'selected':''}>📖 ${esc(c)}</option>`).join('')}</select><input id=mnc placeholder="Chương / chủ đề mới" style="flex:1;min-width:130px"><button class="btn g sm" data-a=mnw>＋ Tạo</button></div>
<div class=row><button class="btn sm" data-a=mgen>🪄 Tạo từ thẻ</button><button class="btn g sm" data-a=mo>${V.mo?'🗺 Xem sơ đồ':'✍️ Sửa bằng dàn ý'}</button><button class="btn g sm" data-a=mrc>${V.rc?'👁 Hiện tất cả':'🙈 Ôn: che ý cuối'}</button><button class="btn g sm" data-a=mcp>📋 Copy dàn ý</button></div>
${V.mo?`<textarea id=mto style="min-height:240px" placeholder="Mỗi dòng một ý. Thụt vào 2 dấu cách để thành nhánh con">${esc(o2t(t))}</textarea><button class=btn data-a=mapl>✅ Áp dụng dàn ý</button>`:`${nb()}<div class=mmw>${svg(L)}</div><small class=mu>${V.rc?'Chế độ ôn: chạm vào “• • •” để hiện ý đã che · ':''}Kéo ngang để xem hết sơ đồ</small>`}</div>`};

/* ===== Công cụ soạn thẻ ===== */
const edt=c=>`<div class=box><h3>✏️ Sửa thẻ</h3><textarea id=eq>${esc(c.q)}</textarea>${c.t=='cloze'?'<p class=mu>Dùng {{từ}} để tạo chỗ trống.</p>':c.t=='mcq'?`<textarea id=eo placeholder="Mỗi dòng một đáp án">${esc(c.o.join('\n'))}</textarea><input id=ek value="${esc(c.k.map(i=>'ABCDEFGH'[i]).join(','))}" placeholder="Đáp án đúng, VD: B hoặc A,C" style="width:100%">`:`<textarea id=ea>${esc(c.a||'')}</textarea>`}<input id=ech list=chl value="${esc(c.ch||'')}" placeholder="📖 Chương" style="width:100%;margin:6px 0"><textarea id=eex placeholder="💡 Giải thích">${esc(c.ex||'')}</textarea><div class=row><button class=btn data-a=esv>💾 Lưu</button><button class="btn g" data-a=ecx>Hủy</button></div></div>`;
const fo7=folder;folder=function(){const mm=V.tab=='mm';let h=fo7();
h=h.replace(/(data-v=tl>[^<]*<\/button>)<\/div>/,`$1<button class="tb ${mm?'on':''}" data-a=tab data-v=mm>🧠 Mindmap</button></div>`);
if(mm){h=h.replace('class="tb on" data-a=tab data-v=card','class="tb" data-a=tab data-v=card');const m=h.match(/^[\s\S]*?<div class=tabs>[\s\S]*?<\/div>/);return m?m[0]+mmv():h}
const ec=V.ec&&D.c.find(x=>x.id==V.ec);
h=h.replace(/<button class="btn g sm" data-a=dc data-v="([^"]+)">Xóa<\/button>/g,(m,id)=>`<button class="btn g sm" data-a=ec data-v="${id}">✏️ Sửa</button><button class="btn g sm" data-a=dup data-v="${id}">⧉ Nhân đôi</button>`+m);
h=h.replace('<div class=row><button class=btn data-a=ac>',m=>`<datalist id=chl>${cc().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>${ec?edt(ec):''}`+m);
h=h.replace('<button class=btn data-a=sc>Lưu</button>',m=>`<input id=nch list=chl value="${esc(V.lch||'')}" placeholder="📖 Chương (tuỳ chọn)" style="width:100%;margin:6px 0"><div class=row><button class="btn g sm" data-a=clz>{{ }} Che từ đã bôi đen</button></div><div id=pvx class=exl hidden></div>`+m);
h=h.replace('Hoặc viết {{từ}} để làm ô điền khuyết','Hoặc viết {{từ}} để làm ô điền khuyết&#10;Dòng bắt đầu bằng # là tên chương, VD: # Chương 1');
return h.replace('<input id=fq',m=>`<details class=box><summary>📖 Quản lý chương &amp; xuất thẻ</summary><div class=row><select id=rcs><option value="">Chọn chương</option>${cc().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select><input id=rcn placeholder="Tên mới (trùng tên cũ = gộp)" style="flex:1;min-width:140px"><button class="btn g sm" data-a=rnc>Đổi tên / gộp</button></div><div class=row><button class="btn g sm" data-a=cpa>📋 Copy tất cả thẻ</button><button class="btn g sm" data-a=ddp>🔍 Xóa thẻ trùng</button></div></details>`+m)};
const op7=A.open;A.open=v=>{V.mc='';V.mn=null;V.mo=0;V.rc=0;V.ec=null;V.rv=new Set();op7(v)};
const sc7=A.sc;A.sc=function(){const n=D.c.length,ch=(($('#nch')||{}).value||'').trim();sc7();if(D.c.length>n){V.lch=ch;D.c[n].ch=ch;sv();R()}};
document.addEventListener('input',e=>{if(e.target.id!='nq')return;const p=$('#pvx'),v=e.target.value;if(p){p.hidden=!v.trim();p.innerHTML='👁 '+hl(v)}});

Object.assign(A,{
mn(v){const f=fnd(tr(),v);if(V.rc&&f&&f.p&&!f.n.c.length&&!V.rv.has(v)){V.rv.add(v);return mmR()}V.mn=v;mmR()},
mac(){const f=cur();if(!f)return;const c={id:nid(),t:'Ý mới',c:[]};f.n.c.push(c);f.n.x=0;sv();V.mn=c.id;mmR();const i=$('#mnt');i&&i.select()},
mas(){const f=cur();if(!f||!f.p)return;const c={id:nid(),t:'Ý mới',c:[]};f.p.c.splice(f.p.c.indexOf(f.n)+1,0,c);sv();V.mn=c.id;mmR();const i=$('#mnt');i&&i.select()},
mdl(v,t){if(!sure(t))return;const f=cur();if(!f||!f.p)return;f.p.c.splice(f.p.c.indexOf(f.n),1);V.mn=f.p.id;sv();mmR()},
mcl(){const f=cur();if(f){f.n.x=f.n.x?0:1;sv();mmR()}},
mcc(v){const f=cur();if(f){f.n.k=v;sv();mmR()}},
mcd(){const f=cur();if(!f)return;let n=0;const w=x=>{if(x.c.length){D.c.push({id:uid(),f:V.fid,t:'qa',q:x.t+' gồm những ý nào?',a:x.c.map(c=>'• '+c.t).join('\n'),tg:[],bx:0,due:0,ch:V.mc||''});n++;x.c.forEach(w)}};w(f.n);sv();T(n?`Đã tạo ${n} thẻ từ nhánh 🃏`:'Nhánh này chưa có ý con')},
mnw(){const n=$('#mnc').value.trim();if(!n)return T('Nhập tên chương / chủ đề');V.mc=n;V.mn=null;tr();sv();R()},
mo(){if(V.mo){V.mo=0}else V.mo=1;R()},mrc(){V.rc=!V.rc;V.rv=new Set();R()},
mcp(){cp(tr().t+'\n'+o2t(tr(),1))},
mapl(){tr().c=t2o($('#mto').value);V.mo=0;V.mn=null;sv();R();T('Đã cập nhật sơ đồ 🧠')},
mgen(v,t){const r=tr();if(r.c.length&&!sure(t))return;const q=c=>(c.q||'').replace(/\{\{(.+?)\}\}/g,'$1').slice(0,60),cn=c=>({id:nid(),t:q(c),c:[{id:nid(),t:(ans(c)||'').slice(0,70),c:[]}]}),cs=D.c.filter(c=>c.f==V.fid&&(!V.mc||c.ch==V.mc)).slice(0,40);
if(!cs.length)return T('Chưa có thẻ nào ở đây');if(V.mc)r.c=cs.map(cn);else{const g={};cs.forEach(c=>(g[c.ch||'Nội dung chung']=g[c.ch||'Nội dung chung']||[]).push(c));r.c=Object.entries(g).map(([k,a])=>({id:nid(),t:k,c:a.map(cn)}))}V.mn=null;sv();R();T('Đã dựng sơ đồ từ '+cs.length+' thẻ (tối đa 40) 🪄')},
ec(v){V.ec=v;R();const e=$('#eq');e&&e.scrollIntoView({block:'center'})},ecx(){V.ec=null;R()},
dup(v){const c=D.c.find(x=>x.id==v);if(!c)return;D.c.splice(D.c.indexOf(c)+1,0,{...c,id:uid(),tg:[],bx:0,due:0,wr:0,rt:0});sv();R();T('Đã nhân đôi thẻ ⧉')},
esv(){const c=D.c.find(x=>x.id==V.ec);if(!c)return;const q=$('#eq').value.trim();if(!q)return T('Câu hỏi đang trống');if(c.t=='cloze'&&!/\{\{.+?\}\}/.test(q))return T('Ô điền khuyết cần có {{từ}}');
if(c.t=='mcq'){const o=$('#eo').value.split('\n').map(s=>s.trim()).filter(Boolean),k=[...new Set(($('#ek').value.toUpperCase().match(/[A-H]/g)||[]).map(x=>'ABCDEFGH'.indexOf(x)))].filter(i=>i<o.length);if(o.length<2||!k.length)return T('Cần ≥2 đáp án và ít nhất 1 đáp án đúng');c.o=o;c.k=k}
else if(c.t!='cloze'){const a=$('#ea').value.trim();if(!a)return T('Thiếu đáp án');c.a=a}
c.q=q;c.ch=$('#ech').value.trim();c.ex=$('#eex').value.trim();V.ec=null;sv();R();T('Đã cập nhật thẻ ✔')},

wd=(t,s)=>Math.min(280,24+[...t].length*7.4+(s=='dia'?34:s=='ell'||s=='hex'?16:0)),

SH=[['rect','▭ Bo góc'],['pill','💊 Viên thuốc'],['sq','▢ Vuông'],['ell','⬭ Elip'],['hex','⬡ Lục giác'],['dia','◇ Thoi'],['par','▱ Bình hành'],['tag','🏷 Thẻ tên'],['note','🗒 Giấy note'],['line','＿ Gạch chân']],
FS=[['rr','▭ Bo góc'],['sq','▢ Vuông'],['ell','⬭ Elip']];

/* ===== hình dáng nút ===== */
const shp=(s,x,y,w,h,f,c,k)=>{const st=`fill:${f};stroke:${c};stroke-width:${k}`,P=a=>`<polygon points="${a.map(q=>q.join(',')).join(' ')}" style="${st}"/>`,RC=r=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" style="${st}"/>`;
return s=='pill'?RC(h/2):s=='sq'?RC(3):s=='ell'?`<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}" style="${st}"/>`
:s=='hex'?P([[x+12,y],[x+w-12,y],[x+w,y+h/2],[x+w-12,y+h],[x+12,y+h],[x,y+h/2]])
:s=='dia'?P([[x+w/2,y-2],[x+w,y+h/2],[x+w/2,y+h+2],[x,y+h/2]])
:s=='par'?P([[x+12,y],[x+w,y],[x+w-12,y+h],[x,y+h]])
:s=='tag'?P([[x,y],[x+w-14,y],[x+w,y+h/2],[x+w-14,y+h],[x,y+h]])
:s=='note'?P([[x,y],[x+w-12,y],[x+w,y+12],[x+w,y+h],[x,y+h]])+`<path d="M${x+w-12} ${y}v12h12" style="fill:none;stroke:${c};stroke-width:${k}"/>`
:s=='line'?`<rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:transparent"/><line x1="${x}" y1="${y+h}" x2="${x+w}" y2="${y+h}" style="stroke:${c};stroke-width:3"/>`:RC(10)};

/* ===== bố cục: tự xếp + vị trí kéo tay (n.p) + khung (root.fr) ===== */
const lay=(root,dr)=>{const nodes=[],mw=[];let y=0;
const walk=(n,d,col)=>{const w=wd(n.t||'…',n.sh),o={n,d,w,col,y:0,ch:[]};mw[d]=Math.max(mw[d]||0,w);nodes.push(o);
if(n.x&&d>0||!n.c.length)o.y=(y+=38)-38;else{n.c.forEach((c,i)=>o.ch.push(walk(c,d+1,c.k||(d==0?CL[i%CL.length]:col))));o.y=(o.ch[0].y+o.ch[o.ch.length-1].y)/2}return o};
walk(root,0,CL[0]);const xs=[0];for(let d=1;d<mw.length;d++)xs[d]=xs[d-1]+mw[d-1]+56;
nodes.forEach(o=>{const p=o.n.p;o.x=p?p[0]:xs[o.d];if(p)o.y=p[1];if(dr&&dr.mv&&dr.ids.has(o.n.id)){o.x+=dr.dx;o.y+=dr.dy}});
const fr=(root.fr||[]).map(f=>{const g={...f};if(dr&&dr.mv&&dr.id==f.id){if(dr.k=='f'){g.x+=dr.dx;g.y+=dr.dy}if(dr.k=='r'){g.w=dr.rw;g.h=dr.rh}}return g});
return{nodes,fr,W:Math.max(900,...nodes.map(o=>o.x+o.w),...fr.map(f=>f.x+f.w))+240,H:Math.max(520,...nodes.map(o=>o.y+40),...fr.map(f=>f.y+f.h))+180}};
const svg=L=>{let p='',g='',a='',b='';const z=V.mz||1,FT="font:600 13px 'Be Vietnam Pro',sans-serif";
L.fr.forEach(f=>{const s=f.sh||'rr',el=s=='ell',st=`fill:color-mix(in srgb,${f.k} 7%,transparent);stroke:${f.k};stroke-width:${V.fs==f.id?3:2};stroke-dasharray:8 5;pointer-events:none`,
hx=f.x+(el?f.w*.18:0),hy=f.y+(el?f.h*.08:0),rx=el?f.x+f.w*.85-9:f.x+f.w-18,ry=el?f.y+f.h*.85-9:f.y+f.h-18;
a+=el?`<ellipse cx="${f.x+f.w/2}" cy="${f.y+f.h/2}" rx="${f.w/2}" ry="${f.h/2}" style="${st}"/>`:`<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="${s=='sq'?4:16}" style="${st}"/>`;
b+=`<g data-d="f:${f.id}" style="cursor:move;touch-action:none"><rect x="${hx}" y="${hy}" width="${Math.min(f.w,Math.max(120,[...f.t].length*8+30))}" height="28" rx="14" style="fill:${f.k}"/><text x="${hx+13}" y="${hy+19}" style="${FT};fill:#fff;pointer-events:none">${esc(f.t)}</text></g><rect data-d="r:${f.id}" x="${rx}" y="${ry}" width="18" height="18" rx="5" style="fill:${f.k};cursor:nwse-resize;touch-action:none"/>`});
L.nodes.forEach(o=>o.ch.forEach(c=>{const x1=o.x+o.w,y1=o.y+19,x2=c.x,y2=c.y+19,m=(x1+x2)/2;p+=`<path d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill="none" stroke="${c.col}" stroke-width="2" opacity=".6"/>`}));
L.nodes.forEach(o=>{const n=o.n,rt=o.d==0,sh=n.sh||(rt?'pill':'rect'),hid=V.rc&&!n.c.length&&!rt&&!V.rv.has(n.id),t=hid?'• • •':(n.t||'…'),ex=sh=='dia'?54:sh=='ell'||sh=='hex'?34:20,mx=Math.floor((o.w-ex)/7.4),tx=[...t].length>mx?[...t].slice(0,mx-1).join('')+'…':t,bd=(rt||o.d==1||n.k)&&sh!='line',
fill=rt?'url(#mg)':n.k||o.d==1?o.col:'color-mix(in srgb,'+o.col+' 14%,var(--cd))';
g+=`<g data-d="n:${n.id}" style="cursor:grab;touch-action:none">${shp(sh,o.x,o.y+2,o.w,34,fill,o.col,V.mn==n.id?3.5:1.5)}<text x="${o.x+o.w/2}" y="${o.y+24}" text-anchor="middle" style="font:${bd?600:400} 13px 'Be Vietnam Pro',sans-serif;fill:${bd?'#fff':'var(--ink)'};pointer-events:none">${esc(tx)}</text>${n.x&&n.c.length?`<text x="${o.x+o.w+4}" y="${o.y+24}" style="font-size:11px;fill:var(--mu)">＋${n.c.length}</text>`:''}</g>`});
return `<svg width="${L.W*z}" height="${L.H*z}" viewBox="0 0 ${L.W} ${L.H}" style="user-select:none"><defs><linearGradient id="mg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g3)"/></linearGradient></defs><g transform="translate(14 14)">${a}${p}${g}${b}</g></svg>`};

/* ===== thanh công cụ: khung, zoom, trình chiếu, màu, hình dáng ===== */
const tb=r=>{const fl=r.fr||[],n=fl.length,fr=V.fs&&fl.find(x=>x.id==V.fs),f=cur(),ch=(on,a,k,l)=>`<span class="ch ${on?'on':''}" data-a=${a} data-v=${k}>${l}</span>`;
return `<div class=mpt><div class=row style="margin:0"><button class="btn g sm" data-a=fadd>＋ Khung</button><button class="btn g sm" data-a=zo>−</button><b>${Math.round(100*(V.mz||1))}%</b><button class="btn g sm" data-a=zi>＋</button><button class="btn g sm" data-a=zf>⤢ Vừa</button><button class="btn g sm" data-a=fpv ${n?'':'disabled'}>◀</button><span class=mu>${n?(V.fi||0)+1+'/'+n+' khung':'0 khung'}</span><button class="btn g sm" data-a=fnx ${n?'':'disabled'}>▶</button><button class="btn sm" data-a=pre>${V.mp?'✕ Thoát':'🖥 Trình chiếu'}</button><button class="btn g sm" data-a=mar>🧹 Xếp lại</button></div>
${fr&&!V.mp?`<div class=row style="margin:6px 0 0"><input data-c=ft value="${esc(fr.t)}" style="flex:1;min-width:120px">${CL.map(c=>sw('fcc',c)).join('')}<button class="btn g sm" data-a=fdl>🗑 Xóa khung</button></div><div class=row style="margin:6px 0 0"><span class=mu>🔷 Hình khung:</span>${FS.map(([k,l])=>ch((fr.sh||'rr')==k,'fsh',k,l)).join('')}</div>`:''}
${f&&!V.mp?`<div class=row style="margin:6px 0 0"><span class=mu>🎨 Màu nhánh:</span>${CL.map(c=>sw('mcc',c)).join('')}</div><div class=row style="margin:6px 0 0"><span class=mu>🔷 Hình dáng:</span>${SH.map(([k,l])=>ch((f.n.sh||(f.p?'rect':'pill'))==k,'msh',k,l)).join('')}</div>`:''}</div>`};

/* ===== kéo thả: nút (kéo cả nhánh), khung (kéo kèm nút bên trong), góc khung (đổi cỡ) ===== */
let DR=null;
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-d]');if(!t||e.button||V.p!='folder'||V.tab!='mm')return;
const[k,id]=t.dataset.d.split(':'),r=tr(),L=lay(r),ids=new Set(),f=(r.fr||[]).find(x=>x.id==id);
if(k=='n'){const q=fnd(r,id);q&&(function w(n){ids.add(n.id);n.c.forEach(w)})(q.n)}
if(k=='f'&&f)L.nodes.forEach(o=>{const cx=o.x+o.w/2,cy=o.y+19;if(cx>f.x&&cx<f.x+f.w&&cy>f.y&&cy<f.y+f.h)ids.add(o.n.id)});
DR={k,id,ids,x0:e.clientX,y0:e.clientY,dx:0,dy:0,mv:0,z:V.mz||1};try{$('.mmw').setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!DR)return;if(!DR.mv&&Math.hypot(e.clientX-DR.x0,e.clientY-DR.y0)<5)return;
DR.mv=1;DR.dx=(e.clientX-DR.x0)/DR.z;DR.dy=(e.clientY-DR.y0)/DR.z;
if(DR.k=='r'){const f=(tr().fr||[]).find(x=>x.id==DR.id);if(f){DR.rw=Math.max(160,f.w+DR.dx);DR.rh=Math.max(100,f.h+DR.dy)}}
const w=$('.mmw');if(w)w.innerHTML=svg(lay(tr(),DR))});
const end=()=>{if(!DR)return;const d=DR;DR=null;const r=tr();if(!d.mv){d.k=='n'?A.mn(d.id):A.mf(d.id);return}
const f=(r.fr||[]).find(x=>x.id==d.id);
if(f&&d.k=='r'){f.w=Math.round(d.rw);f.h=Math.round(d.rh)}if(f&&d.k=='f'){f.x=Math.max(0,Math.round(f.x+d.dx));f.y=Math.max(0,Math.round(f.y+d.dy))}
if(d.k!='r')lay(r,d).nodes.forEach(o=>{if(d.ids.has(o.n.id))o.n.p=[Math.max(0,Math.round(o.x)),Math.max(0,Math.round(o.y))]});
sv();K()};
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
document.addEventListener('keydown',e=>{if(V.p!='folder'||!V.mp||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='Escape')A.pre();if(e.key=='ArrowRight')A.fnx();if(e.key=='ArrowLeft')A.fpv()});

/* ===== hành động ===== */
const foc=i=>{const r=tr(),f=(r.fr||[])[i];if(!f)return T('Chưa có khung nào — bấm “＋ Khung”');V.fi=i;V.fs=null;const w=$('.mmw'),z=Math.max(.3,Math.min(2,Math.min((w.clientWidth-30)/f.w,(w.clientHeight-30)/f.h)));V.mz=+z.toFixed(2);R();const x=$('.mmw');x.scrollLeft=(f.x-6)*V.mz;x.scrollTop=(f.y-6)*V.mz};
const mn7=A.mn;
Object.assign(A,{
mn(v){V.fs=null;mn7(v)},mf(v){V.fs=v;V.mn=null;K()},
msh(v){const f=cur();if(f){f.n.sh=v;sv();K()}},
fsh(v){const f=(tr().fr||[]).find(x=>x.id==V.fs);if(f){f.sh=v;sv();K()}},

fcc(v){const f=(tr().fr||[]).find(x=>x.id==V.fs);if(f){f.k=v;sv();K()}},
fdl(v,t){if(!sure(t))return;const r=tr();r.fr=(r.fr||[]).filter(x=>x.id!=V.fs);V.fs=null;sv();K()},
zi(){V.mz=Math.min(2.5,+((V.mz||1)+.15).toFixed(2));K()},zo(){V.mz=Math.max(.25,+((V.mz||1)-.15).toFixed(2));K()},
zf(){const L=lay(tr()),w=$('.mmw');V.mz=Math.max(.25,Math.min(1.5,+((w.clientWidth-24)/(L.W-200)).toFixed(2)));R();const x=$('.mmw');x.scrollLeft=0;x.scrollTop=0},
fnx(){const n=(tr().fr||[]).length;if(n)foc(((V.fi||0)+1)%n)},fpv(){const n=(tr().fr||[]).length;if(n)foc(((V.fi||0)+n-1)%n)},
pre(){V.mp=!V.mp;V.fs=null;V.mn=null;R()},
mar(){const w=n=>{delete n.p;n.c.forEach(w)};w(tr());sv();K();T('Đã xếp lại sơ đồ 🧹')}});
C.ft=t=>{const f=(tr().fr||[]).find(x=>x.id==V.fs);if(f){f.t=t.value.trim()||'Khung';sv();K()}};

/* ===== bỏ “Đến hạn ôn”: mặc định ôn TẤT CẢ thẻ ===== */
const go8=go;go=function(cs,m,s,...r){go8(cs,m,s=='due'?'all':s,...r)};
const hh8=home;home=function(){return hh8().replace(/ · \d+ đến hạn/g,'')};

if(V.tab=='mm'){if(V.mo)return h;const r=tr(),L=lay(r);

h=h.replace(/(<details class=box><summary>(?:📝 Thi thử|⚡ Thêm nhiều)[\s\S]*?)(<input id=fq)/,(m,a,b)=>`<details class=tools><summary>🛠 Công cụ nâng cao · thi thử, nhập nhiều thẻ, quản lý chương</summary>${a}</details>${b}`);
return h.replace('<p class=mu>Chưa có gì ở đây 🌸</p>','<div class="box emp"><div style="font-size:2.2rem">🌱</div><h3>Thư mục còn trống</h3><p class=mu>Bắt đầu bằng một trong ba cách:</p><div class=row><button class=btn data-a=ac>＋ Thêm thẻ</button><button class="btn g" data-a=im>📄 Nhập Word / PDF</button><button class="btn g" data-a=tab data-v=mm>🧠 Vẽ mindmap</button></div></div>')};
R();
})();

<style>

<script>
(()=>{
const pad=n=>String(n).padStart(2,'0'),dt=t=>{const x=new Date(t);return pad(x.getDate())+'/'+pad(x.getMonth()+1)+'/'+x.getFullYear()},
kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB',
host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}},

ico=d=>{const s=(d.mt||'')+' '+d.n;return d.k=='link'?'🔗':d.k=='note'?'🗒':/pdf/i.test(s)?'📕':/image/i.test(s)?'🖼':/word|\.docx?\b/i.test(s)?'📘':/sheet|excel|csv|\.xlsx?\b/i.test(s)?'📊':/presentation|powerpoint|\.pptx?\b/i.test(s)?'📙':/video/i.test(s)?'🎞':/audio/i.test(s)?'🎧':'📄'};

/* ===== kho file trong trình duyệt (IndexedDB) ===== */
const IX=()=>IX.p||(IX.p=new Promise((ok,no)=>{const r=indexedDB.open('mayhoc-docs',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})),
idb=(m,fn)=>IX().then(d=>new Promise((ok,no)=>{const t=d.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no(t.error)}));
const U={};
new MutationObserver(()=>document.querySelectorAll('img[data-th]:not([src])').forEach(i=>{const id=i.dataset.th;U[id]?i.src=U[id]:idb('readonly',s=>s.get(id)).then(b=>{if(b)i.src=U[id]=URL.createObjectURL(b)}).catch(()=>0)})).observe($('#app'),{childList:true,subtree:true});
const est=()=>{try{navigator.storage.estimate().then(e=>{const x=$('#stg');if(x)x.textContent='💾 Trình duyệt đang dùng '+kb(e.usage||0)+(e.quota?' / '+kb(e.quota):'')})}catch(e){}};

if(n){sv();R();T('Đã lưu '+n+' tài liệu 📎')}};
const lnk=(u,n)=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';if(n)a.download=n;a.click()};

/* ===== tab 📎 Tài liệu trong thư mục ===== */
const dcv=()=>{const all=(D.dc||[]).filter(d=>d.f==V.fid),k=V.dk||'all',
L=all.filter(d=>k=='all'||(k=='pin'?d.pin:d.k==k)).sort((a,b)=>(b.pin||0)-(a.pin||0)||b.at-a.at),
td=(D.td||[]).filter(x=>x.f==V.fid),dn=td.filter(x=>x.x).length,
chs=[...new Set(D.c.filter(c=>c.f==V.fid&&c.ch).map(c=>c.ch))];setTimeout(est,0);
const row=d=>{const meta=d.k=='file'?kb(d.sz)+' · '+dt(d.at):d.k=='link'?esc(host(d.u))+' · '+dt(d.at):dt(d.at)+' · '+(d.b||'').length+' ký tự';

return h.replace('<div class=box><h3>📈 14 ngày',`<div class=box><h3>🍅 Pomodoro 7 ngày · ${tot} phiên</h3><div class=brs style="height:90px">${b.map(([d,n])=>`<div><i title="${n} phiên" style="height:${Math.round(70*n/mx)}px;min-height:${n?3:0}px;background:var(--pr)"></i>${d}</div>`).join('')}</div></div><div class=box><h3>📈 14 ngày`)};

/* ===== khởi động: khôi phục bộ đếm đang chạy nếu tải lại trang ===== */
const t0=D.pt;if(t0&&t0.end>now()){ph=t0.ph;cy=t0.cy||0;end=t0.end;left=Math.round((end-now())/1e3);on=1;iv=setInterval(tick,400)}
rb();
})();
</script>
<!-- MÂY HỌC · ADD-ON v13 (thu gọn đồng hồ/âm thanh · lofi · YouTube) — dán SAU khối v12 (ngay trước </body>) -->
<style>
#pom.mini>[data-a=pr],#pom.mini>[data-a=psk],#pom.mini>#pmz,#pom.mini .pmp,#pom.mini .pmw small{display:none}
#snb{display:none!important}
#snd{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8}
@media(max-width:700px){#snd{bottom:calc(84px + env(safe-area-inset-bottom,0px))}body[data-p=study] #snd{bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
.sdb{display:flex;gap:4px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:99px;padding:4px;box-shadow:var(--sh)}
.sdb .ic{border:0;background:var(--so);color:var(--pt);padding:7px 12px}
#snd.mini .sdn,#snd.mini [data-a=sps]{display:none}
.sdp{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:var(--sh);font-size:.9rem;display:flex;flex-direction:column;gap:10px}
#snd:not(.open) .sdp{position:fixed;left:-9999px;top:0;width:340px}
#snd.open .sdp{position:absolute;left:0;bottom:calc(100% + 10px);width:min(340px,calc(100vw - 24px));max-height:78vh;overflow:auto}
#sdc{display:flex;flex-direction:column;gap:10px}#sdc:empty{display:none}
#ytw{display:none;height:170px;border-radius:14px;overflow:hidden;background:#000}#ytw.has{display:block}
.sdp input[type=range]{width:100%}.sdp select{max-width:150px}.sdp label{display:flex;gap:8px;align-items:center;cursor:pointer}
</style>
<script>
(()=>{
const N=()=>D.sn=Object.assign({vol:60,sy:0,yt:[],last:null,pm:0,sm:0},D.sn),
SRC=[['rain','🌧 Mưa'],['brown','🌊 Ồn nâu'],['white','💨 Ồn trắng'],['lofi','☕ Lofi đêm'],['lofir','🌙 Lofi + mưa'],['piano','🎹 Piano êm']],
SUG=[{n:'Lofi Girl (radio)',v:'jfKfPfyJRdk'}],
opn=u=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click()};
$('#snb')&&$('#snb').remove();
document.body.insertAdjacentHTML('beforeend','<div id=snd><div class=sdp><div id=sdc></div><div id=ytw></div></div><div class=sdb id=sdb></div></div>');

/* ===== 1 · nút thu gọn / mở rộng đồng hồ Pomodoro ===== */
const pm=$('#pom'),mkB=()=>{if($('#pmm'))return;const b=document.createElement('button');b.id='pmm';b.dataset.a='pmi';b.title='Thu gọn / mở rộng';b.textContent=N().pm?'▸':'▾';pm.insertBefore(b,pm.querySelector('.pmp'))};
new MutationObserver(mkB).observe(pm,{childList:true});mkB();pm.classList.toggle('mini',!!N().pm);

/* ===== 2 · bộ phát âm thanh: ồn trắng/nâu/mưa + lofi tạo ngay trong trình duyệt ===== */
let AC,MG,cur=null,pa=0,stopFn=null,sl=0;
const ctx=()=>{if(!AC){AC=new AudioContext();MG=AC.createGain();MG.connect(AC.destination)}MG.gain.value=N().vol/100*.7;if(AC.state=='suspended')AC.resume();return AC},
noise=(k,g)=>{const a=ctx(),n=a.sampleRate*3,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(k=='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w*.5}
const s=a.createBufferSource(),f=a.createBiquadFilter(),o=a.createGain();s.buffer=b;s.loop=true;f.type=k=='rain'?'bandpass':'lowpass';f.frequency.value=k=='rain'?1800:k=='white'?8000:600;o.gain.value=g||.5;s.connect(f);f.connect(o);o.connect(MG);s.start();return()=>{try{s.stop()}catch(e){}}},
lofi=(bpm,rain,piano)=>{const a=ctx(),sp=60/bpm,sg=a.createGain(),ml=a.createBiquadFilter(),CH=[[48,55,59,64],[45,52,55,60],[50,57,60,65],[43,50,53,59]],PN=[72,74,76,79,81,84],
nb=(()=>{const b=a.createBuffer(1,a.sampleRate*.2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b})();
sg.connect(MG);ml.type='lowpass';ml.frequency.value=2400;ml.connect(sg);
const tone=(m,t,d,v,ty)=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=440*2**((m-69)/12);o.detune.value=(Math.random()-.5)*16;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ml);o.start(t);o.stop(t+d+.05)},
ns=(t,f,v,d)=>{const s=a.createBufferSource(),h=a.createBiquadFilter(),g=a.createGain();s.buffer=nb;h.type='highpass';h.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(h);h.connect(g);g.connect(ml);s.start(t);s.stop(t+d)},
kick=t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.15);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(ml);o.start(t);o.stop(t+.3)};
let nt=a.currentTime+.1,st=0,bar=0;
const h=setInterval(()=>{while(nt<a.currentTime+.6){const t=nt+(st%2?sp*.1:0);
if(!st)CH[bar%4].forEach((m,i)=>tone(m,t+i*.02,sp*3.8,piano?.09:.06,piano?'triangle':'sine'));
if(!piano){if(st==0||st==4)kick(t);if(st==2||st==6)ns(t,1500,.18,.12);ns(t,7000,.04,.04)}
if(!(st%2)&&Math.random()<(piano?.45:.3))tone(PN[Math.random()*6|0],t,sp*1.6,.05,'sine');
if(Math.random()<.4)ns(t+Math.random()*sp/2,3000,.012,.01);
nt+=sp/2;if(++st==8){st=0;bar++}}},120),rs=rain?noise('rain',.25):null;
return()=>{clearInterval(h);rs&&rs();sg.gain.setTargetAtTime(0,a.currentTime,.08);setTimeout(()=>sg.disconnect(),600)}},
start=k=>k=='lofi'?lofi(72,0,0):k=='lofir'?lofi(68,1,0):k=='piano'?lofi(60,0,1):noise(k,.5);

/* ===== 3 · YouTube: dán link video / playlist / live ===== */
const yid=u=>{u=String(u||'');const m=u.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/),l=u.match(/[?&]list=([\w-]+)/);return m?{v:m[1],l:l&&l[1]}:l?{l:l[1]}:null},
ysrc=y=>'https://www.youtube.com/embed/'+(y.v?y.v+'?':'videoseries?')+(y.l?'list='+y.l+'&':'')+'autoplay=1&loop=1&enablejsapi=1&playsinline=1'+(y.v&&!y.l?'&playlist='+y.v:''),
yc=(f,a)=>{const i=$('#ytw iframe');try{i&&i.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')}catch(e){}},
yurl=y=>y.v?'https://www.youtube.com/watch?v='+y.v+(y.l?'&list='+y.l:''):'https://www.youtube.com/playlist?list='+y.l;

const kill=()=>{stopFn&&stopFn();stopFn=null;const w=$('#ytw');w.innerHTML='';w.className=''},
stopAll=()=>{kill();clearTimeout(sl);cur=null;pa=0;ui()},
play=c=>{kill();cur=c;pa=0;N().last=c;sv();try{if(c.y){const w=$('#ytw');w.innerHTML=`<iframe src="${ysrc(c.y)}" allow="autoplay; encrypted-media" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`;w.className='has';setTimeout(()=>yc('setVolume',[N().vol]),1500)}else stopFn=start(c.k)}catch(e){cur=null;T('Không phát được âm thanh ở trình duyệt này')}ui()},
pause=()=>{if(!cur||pa)return;pa=1;if(cur.y)yc('pauseVideo');else{stopFn&&stopFn();stopFn=null}ui()},
resume=()=>{if(!cur||!pa)return;pa=0;if(cur.y)yc('playVideo');else try{stopFn=start(cur.k)}catch(e){}ui()};

/* ===== 4 · giao diện ===== */
const pn=()=>{const s=N(),ys=[...SUG,...s.yt],same=y=>cur&&cur.y&&cur.y.v==y.v&&cur.y.l==y.l;
return `<div class=pmh><b>🎧 Âm thanh học tập</b><button class=ic data-a=sdo>✕</button></div>
<div class=row style="margin:0">${SRC.map(([k,l])=>`<span class="ch ${cur&&cur.k==k?'on':''}" data-a=sp data-v=${k}>${l}</span>`).join('')}</div>
<b>▶ YouTube</b><div class=row style="margin:0">${ys.map((y,i)=>`<span class="ch ${same(y)?'on':''}" data-a=yc2 data-v=${i}>▶ ${esc(y.n)}${i>=SUG.length?` <span data-a=ydl data-v=${i-SUG.length}>✕</span>`:''}</span>`).join('')}</div>
<div class=row style="margin:0"><input id=yu placeholder="Dán link YouTube (video / playlist / live)" style="flex:1;min-width:150px"><input id=yn placeholder="Tên (tuỳ chọn)" style="width:110px"></div>
<div class=row style="margin:0"><button class="btn sm" data-a=yp>▶ Phát</button><button class="btn g sm" data-a=ysv>＋ Lưu link</button><button class="btn g sm" data-a=yop>↗ Mở trên YouTube</button><button class="btn g sm" data-a=sst>⏹ Tắt</button></div>
<div class=pmg><span>🔊 Âm lượng</span><input type=range min=0 max=100 value=${s.vol} data-c=svl></div>
<div class=pmg><span>😴 Hẹn giờ tắt</span><select data-c=stm>${[[0,'Không'],[15,'15 phút'],[30,'30 phút'],[60,'60 phút']].map(([v,l])=>`<option value=${v} ${V.st==v?'selected':''}>${l}</option>`).join('')}</select></div>
<label><input type=checkbox data-c=ssy ${s.sy?'checked':''}> 🍅 Tự phát khi vào phiên tập trung, dừng khi nghỉ</label>
<small class=mu>Lofi được tạo ngay trong trình duyệt (không cần mạng, không phải bài hát thật). YouTube cần mạng — nếu trang chặn nhúng video, bấm “Mở trên YouTube”.</small>`},
ui=()=>{const s=N(),r=$('#snd'),nm=cur?(cur.y?'YouTube':SRC.find(x=>x[0]==cur.k)[1])+(pa?' ⏸':''):'Âm thanh';
r.classList.toggle('open',!!V.so);r.classList.toggle('mini',!!s.sm);
$('#sdb').innerHTML=`<button class=ic data-a=sdo>🎧<span class=sdn> ${esc(nm)}</span></button>${cur?`<button class=ic data-a=sps>${pa?'▶':'⏸'}</button>`:''}<button class=ic data-a=smn title="Thu gọn / mở rộng">${s.sm?'▸':'▾'}</button>`;
$('#sdc').innerHTML=V.so?pn():''};

Object.assign(A,{
sdo(){V.so=!V.so;if(V.so&&V.pmo)A.pz();ui()},
smn(){const s=N();s.sm=!s.sm;sv();ui()},
pmi(){const s=N();s.pm=!s.pm;sv();pm.classList.toggle('mini',!!s.pm);const b=$('#pmm');b&&(b.textContent=s.pm?'▸':'▾')},
sp(v){cur&&cur.k==v?stopAll():play({k:v})},
sps(){pa?resume():pause()},sst(){stopAll()},
yp(){const y=yid($('#yu').value);if(!y)return T('Dán link YouTube hợp lệ nhé');play({y})},
ysv(){const y=yid($('#yu').value);if(!y)return T('Dán link YouTube hợp lệ nhé');const s=N();s.yt.push({n:($('#yn').value||'').trim()||'YouTube '+(s.yt.length+1),v:y.v,l:y.l});sv();ui();T('Đã lưu link ✔')},
yc2(v){const y=[...SUG,...N().yt][+v];y&&play({y:{v:y.v,l:y.l}})},
ydl(v){N().yt.splice(+v,1);sv();ui()},
yop(){const y=yid($('#yu')&&$('#yu').value)||(cur&&cur.y)||(N().last&&N().last.y);y?opn(yurl(y)):T('Chưa có link nào để mở')}});
C.svl=t=>{N().vol=+t.value;sv();MG&&(MG.gain.value=N().vol/100*.7);yc('setVolume',[N().vol])};
C.stm=t=>{clearTimeout(sl);const m=+t.value;V.st=m;if(m)sl=setTimeout(()=>{stopAll();T('😴 Đã tắt âm thanh theo hẹn giờ')},m*6e4)};
C.ssy=t=>{N().sy=t.checked?1:0;sv()};
const pz0=A.pz;A.pz=function(){if(!V.pmo&&V.so){V.so=0;ui()}pz0()};
document.addEventListener('click',e=>{if(V.so&&!e.composedPath().some(n=>n.id=='snd')){V.so=0;ui()}});

/* ===== 5 · đồng bộ Pomodoro: vào phiên tập trung thì phát, nghỉ thì dừng ===== */
let lp=pm.dataset.ph||'f';
new MutationObserver(()=>{const p=pm.dataset.ph;if(p==lp)return;lp=p;const s=N();if(!s.sy||!s.last)return;if(p=='f'){cur?resume():play(s.last)}else pause()}).observe(pm,{attributes:true,attributeFilter:['data-ph']});
ui();
})();
</script></body></html>
